<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio · StockTrade</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-header">
        <a class="brand brand-dark" href="dashboard.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 16.5L9 11l3.5 3.5L20 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M15 7h5v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-name">STOCKTRADE</span>
        </a>
        <nav class="app-nav" aria-label="Primary">
          <a class="nav-link" href="dashboard.html">Market Dashboard</a>
          <a class="nav-link" href="orders.html">Orders</a>
          <a class="nav-link active" href="portfolio.html">Portfolio</a>
          <a class="nav-link" href="history.html">History</a>
        </nav>
        <div class="header-meta">
          <div class="buying-power">
            <span class="meta-label">Available cash balance</span>
            <strong id="buying-power">$0.00</strong>
          </div>
          <div class="account-chip">
            <span id="user-name">Trader</span>
            <button id="sign-out" class="btn-logout" type="button">Logout</button>
          </div>
        </div>
      </header>
      <section class="card page-card">
        <h1>Portfolio</h1>
        <p class="lede">Placeholder for the portfolio of this account.</p>
        <div id="table-target"></div>
      </section>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    </script>
  </body>
</html>
